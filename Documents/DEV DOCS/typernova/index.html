<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TyperNova | Build Stars With Words</title>
    <script type="module" src="/src/main.js"></script>
    
    <link rel="stylesheet" href="/src/style.css" /> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">

  </head>
 <body class="bg-black text-white w-full h-screen overflow-hidden relative">
    
    <!-- 1. The Void (Module C will mount the 3D scene here) -->
    <canvas id="webgl-canvas" class="absolute inset-0 w-full h-full z-0"></canvas>
     <header class="w-full p-6 flex justify-between items-center pointer-events-auto">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center shadow-[0_0_15px_rgba(0,170,255,0.5)]">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold tracking-tighter text-white">TYPERNOVA</h1>
            </div>
            
            <nav class="hidden md:flex gap-6 items-center">
                <a href="#" class="text-sm font-medium text-gray-400 hover:text-white transition">My Universe</a>
                <a href="#" class="text-sm font-medium text-gray-400 hover:text-white transition flex items-center gap-2">
                    Marketplace <span class="px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 text-xs border border-blue-500/30">Pro</span>
                </a>
                <!-- Add Profile Image if needed -->
            </nav>
        </header>

    <!-- 2. The Bridge (Module A will manipulate this layer) -->
    <!-- pointer-events-none ensures clicks pass through the UI down to the hidden input -->
    <div id="ui-layer" class="relative z-10 w-full h-full flex flex-col items-center justify-center pointer-events-none">
      
      <!-- Metrics Dashboard -->
      <div class="absolute top-10 flex space-x-12 font-nova text-2xl tracking-widest text-gray-400">
        <div>WPM: <span id="wpm-display" class="text-white">0</span></div>
        <div>ACC: <span id="acc-display" class="text-white">100</span>%</div>
        <div>NovaPoint: <span id="nova-point" class="text-white">100</span>%</div>
      </div>

      <!-- Target Text Container -->
      <div id="text-display" class="font-nova text-4xl max-w-4xl text-center leading-relaxed tracking-wide text-gray-600">
        <!-- Module B will inject styled spans here, e.g., 
             <span class="text-white">H</span><span class="text-red-500">e</span>... -->
        Press any key to begin...
      </div>
      
    </div>

    <!-- 3. The I/O Pipeline (Captures input for Module B) -->
    <!-- opacity-0 hides it, pointer-events-auto allows it to be clicked/focused -->
    <input 
      type="text" 
      id="hidden-input" 
      autofocus 
      autocomplete="off" 
      autocorrect="off" 
      autocapitalize="off" 
      spellcheck="false" 
      class="absolute top-0 left-0 opacity-0 -z-50 pointer-events-auto" 
    />
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
